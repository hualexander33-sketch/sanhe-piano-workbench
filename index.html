const make=(tag,cl,txt)=>{const n=document.createElement(tag);if(cl)n.className=cl;if(txt!==undefined)n.textContent=txt;return n;};
const nf=new Intl.NumberFormat('zh-CN');
const n=value=>nf.format(value);
const time=minutes=>{const h=Math.floor(minutes/60),m=minutes%60;return (h?n(h)+' 小时':'')+(h&&m?' ': '')+(m||!h?n(m)+' 分钟':'');};
const monthName=value=>value.slice(0,4)+' 年 '+Number(value.slice(5))+' 月';
const dateText=value=>String(value||'').replaceAll('-','.');
let data, learners=[], page=0, rosterReady=false, epoch=0;
const pageSize=12;
function option(value,txt){return new Option(txt,value);}
function summary(){el('asof').textContent='数据截至 '+dateText(data.as_of);el('used').textContent=n(data.used);el('duration').textContent='累计授课 '+time(data.minutes);
 const metrics=[['学员',data.students,'人'],['课包',data.packages,'个'],['购课含赠课',data.purchased,'节'],['剩余课时',data.remaining,'节']];
 el('metrics').replaceChildren(...metrics.map(([label,val,unit])=>{const box=make('div','metric'),dl=make('dl'),dd=make('dd',null,n(val));dd.append(make('span',null,unit));dl.append(make('dt',null,label),dd);box.append(dl);return box;}));
 el('period').replaceChildren(option('all','全部月份'),...data.months.slice().reverse().map(row=>option(row.month,monthName(row.month))));periodChange();}
function periodChange(){const id=el('period').value, selected=data.months.find(m=>m.month===id);
 el('rangeTitle').textContent=selected?monthName(id):'全部月份';const count=selected?selected.lessons:data.used;
 el('rangeCount').replaceChildren(document.createTextNode(n(count)),make('span',null,'节'));el('rangeTime').textContent='授课时长 '+time(selected?selected.minutes:data.minutes);
 const rows=data.teachers.map(t=>({name:t.name,count:selected?(selected.by_teacher[t.name]||0):t.lessons})).sort((a,b)=>b.count-a.count);
 const max=Math.max(...rows.map(t=>t.count),1);
 el('staff').replaceChildren(...rows.map(t=>{const li=make('li'),track=make('span','track'),bar=make('i','bar');bar.style.width=(100*t.count/max)+'%';track.append(bar);li.append(make('span',null,t.name),track,make('b',null,n(t.count)+' 节'));return li;}));
 const months=data.months;el('timeline').replaceChildren();if(!months.length)return;const bars=make('div','bars'),ends=make('div','ends'),peak=Math.max(1,...months.map(r=>r.lessons));months.forEach(row=>{const b=make('button');b.type='button';b.title=monthName(row.month)+' · '+n(row.lessons)+' 节';b.setAttribute('aria-label',b.title);b.setAttribute('aria-pressed',String(row.month===id));b.style.height=Math.max(3,Math.round(52*row.lessons/peak))+'px';b.onclick=()=>{el('period').value=row.month;periodChange();el('period').focus();};bars.append(b);});ends.append(make('span',null,months[0].month),make('span',null,months[months.length-1].month));el('timeline').append(bars,ends);}
function showTab(inRoster){el('overview').hidden=inRoster;el('roster').hidden=!inRoster;el('overviewTab').setAttribute('aria-current',inRoster?'false':'page');el('rosterTab').setAttribute('aria-current',inRoster?'page':'false');if(inRoster)showList();}
function showList(){const search=el('query').value.trim().toLocaleLowerCase('zh'),rows=learners.filter(s=>s.name.toLocaleLowerCase('zh').includes(search)),pages=Math.ceil(rows.length/pageSize);
 page=Math.min(page,Math.max(0,pages-1));el('rosterCount').textContent=search?'匹配 '+rows.length+' 位学员':'共 '+learners.length+' 位学员';el('list').replaceChildren(...rows.slice(page*pageSize,(page+1)*pageSize).map(s=>{const b=make('button','student'),name=make('div'),bal=s.packages.reduce((tot,p)=>tot+p.remaining,0);b.type='button';b.setAttribute('aria-label','查看'+s.name+'的档案');name.append(make('strong',null,s.name),make('small',null,s.subjects.join('、')+' · '+s.packages.length+' 个课包'));b.append(name,make('span','balance','余 '+bal+' 节 ›'));b.onclick=()=>openStudent(s);return b;}));if(!rows.length)el('list').append(make('p','empty','没有找到匹配的学员'));
 el('pages').replaceChildren();if(pages<=1)return;const controls=make('div');for(const [label,delta] of [['上一页',-1],['下一页',1]]){const b=make('button','control',label);b.type='button';b.disabled=page+delta<0||page+delta>=pages;b.onclick=()=>{page+=delta;showList();el('roster').scrollIntoView({block:'start'});};controls.append(b);}el('pages').append(make('span','small','第 '+(page+1)+' / '+pages+' 页'),controls);}
function openStudent(s){el('detailName').textContent=s.name;el('detailSubject').textContent=s.subjects.join('、');const body=el('detailBody'),packs=make('div','packs');body.replaceChildren(make('h3',null,'课包（'+s.packages.length+'）'),packs);
 for(const p of s.packages){const box=make('article','pack'),h=make('header');h.append(make('h4',null,p.course+' · '+p.teacher),make('b',null,'剩 '+n(p.remaining)+' 节'));box.append(h,make('p',null,'缴费日 '+dateText(p.date)+' · 共 '+n(p.total)+' 节 · 已上 '+n(p.used)+' 节'),make('p',null,'课包 '+p.id));if(p.members.length>1)box.append(make('p',null,'共用学员 '+p.members.join('、')));packs.append(box);}
 body.append(make('h3',null,'上课记录（'+s.lessons.length+'）'));const sorted=s.lessons.slice().sort((a,b)=>b.date.localeCompare(a.date));if(sorted.length){const table=make('table','records'),thead=table.createTHead().insertRow(),tbody=table.createTBody();for(const text of ['上课日期','科目','授课老师','时长'])thead.append(make('th',null,text));for(const row of sorted){const tr=tbody.insertRow();for(const txt of [dateText(row.date),row.course,row.teacher,row.minutes+' 分钟'])tr.append(make('td',null,txt));}body.append(table);}else body.append(make('p','small','暂未登记上课记录'));
 el('detail').showModal();el('detail').scrollTop=0;document.body.style.overflow='hidden';}
async function get(path){const response=await fetch(path,{credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok)throw Error('load');return response.arrayBuffer();}
async function loadPrivate(raw){if(!/^[A-Za-z0-9_-]{43}$/.test(raw)||!window.crypto?.subtle)throw Error('key');const keyBytes=Uint8Array.from(atob(raw.replaceAll('-','+').replaceAll('_','/')+'='),s=>s.charCodeAt(0));
 const file=await get('./records.bin'),payload=new Uint8Array(file),key=await crypto.subtle.importKey('raw',keyBytes,{name:'AES-GCM'},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.subarray(0,12)},key,payload.subarray(12));return JSON.parse(new TextDecoder().decode(plain));}
function message(text,retry){el('status').hidden=false;el('status').replaceChildren(make('span',null,text));if(retry){const b=make('button','retry','重新读取');b.type='button';b.style.marginLeft='10px';b.onclick=load;el('status').append(b);}}
function hideViews(){el('detailBody').replaceChildren();el('detailName').textContent='';el('detailSubject').textContent='';el('list').replaceChildren();el('roster').hidden=true;el('overview').hidden=true;el('nav').hidden=true;el('shareTools').hidden=true;el('manualCopy').hidden=true;el('manualCopy').value='';el('copyState').textContent='';el('status').hidden=true;el('locked').hidden=true;}
async function load(){const version=++epoch;learners=[];data=null;rosterReady=false;page=0;el('period').value='all';el('query').value='';if(el('detail').open)el('detail').close();hideViews();
 const hash=location.hash.slice(1);if(!hash.startsWith('k=')){el('locked').hidden=false;return;}
 message('正在读取工作台…');
 try{const payload=await loadPrivate(new URLSearchParams(hash).get('k')||'');if(version!==epoch)return;
 if(!payload.summary||!Array.isArray(payload.roster))throw Error('format');data=payload.summary;data.months.sort((a,b)=>a.month.localeCompare(b.month));learners=payload.roster;summary();rosterReady=true;el('nav').hidden=false;showTab(false);el('status').hidden=true;
 const local=['localhost','127.0.0.1','[::1]'].includes(location.hostname)||/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)||location.hostname.endsWith('.local');
 el('shareTools').hidden=local||location.protocol!=='https:';
 }catch{if(version===epoch)message('无法打开工作台，请使用完整的内部分享链接。',true);}}
el('copyLink').onclick=async()=>{if(!rosterReady)return;const text=location.href;try{await navigator.clipboard.writeText(text);el('copyState').textContent='已复制，可发给需要查看的老师。';}catch{const field=el('manualCopy');field.hidden=false;field.value=text;field.focus();field.select();el('copyState').textContent='请选择并复制完整链接。';}};
el('query').addEventListener('input',()=>{page=0;showList();});el('period').addEventListener('change',periodChange);el('overviewTab').onclick=()=>showTab(false);el('rosterTab').onclick=()=>{if(rosterReady)showTab(true);};el('closeDetail').onclick=()=>el('detail').close();el('detail').addEventListener('close',()=>{document.body.style.overflow='';});el('detail').addEventListener('click',e=>{if(e.target===el('detail')){const b=el('detail').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)el('detail').close();}});window.addEventListener('hashchange',load);load();
</script></body></html>
